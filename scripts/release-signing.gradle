// Injected by the GitHub Actions release workflow after Expo Prebuild.
// Credentials stay in GitHub Actions secrets and are never written to the repo.
gradle.projectsEvaluated {
    // This file is supplied as an init script. Gradle also evaluates init
    // scripts for included builds (such as React Native's :gradle-plugin),
    // which do not contain the application's :app project.
    def appProject = rootProject.findProject(":app")
    if (appProject == null) {
        return
    }

    def signingConfigs = appProject.android.signingConfigs
    def releaseConfig = signingConfigs.findByName("release") ?: signingConfigs.create("release")

    releaseConfig.storeFile = rootProject.file(System.getenv("ANDROID_KEYSTORE_PATH"))
    releaseConfig.storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
    releaseConfig.keyAlias = System.getenv("ANDROID_KEY_ALIAS")
    releaseConfig.keyPassword = System.getenv("ANDROID_KEY_PASSWORD")

    appProject.android.buildTypes.getByName("release").signingConfig = releaseConfig
}
