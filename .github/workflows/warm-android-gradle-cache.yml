name: Warm Android Gradle cache

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warm:
    name: Warm release-build cache
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the Android project
        run: pnpm exec expo prebuild --platform android --non-interactive --no-install

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Warm the release-build cache
        working-directory: android
        run: ./gradlew app:assembleRelease --build-cache
