name: Trigger Android release

on:
  push:
    tags:
      - "*"

permissions:
  actions: write
  contents: read

jobs:
  trigger_release:
    name: Run the release pipeline on the default branch
    runs-on: ubuntu-latest

    steps:
      - name: Start and wait for the release pipeline
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh workflow run publish-android-release.yml \
            --repo "$REPOSITORY" \
            --ref "$DEFAULT_BRANCH" \
            -f "release_tag=$RELEASE_TAG"

          for attempt in {1..30}; do
            release_run_id="$(gh run list \
              --repo "$REPOSITORY" \
              --workflow publish-android-release.yml \
              --branch "$DEFAULT_BRANCH" \
              --event workflow_dispatch \
              --limit 30 \
              --json databaseId,displayTitle \
              | jq -r --arg release_tag "$RELEASE_TAG" \
                '.[] | select(.displayTitle == ("Build Android release for " + $release_tag)) | .databaseId' \
              | head -n 1)"

            if [ -n "$release_run_id" ]; then
              gh run watch "$release_run_id" --repo "$REPOSITORY" --exit-status
              exit $?
            fi

            sleep 2
          done

          echo "Timed out waiting for the Android release pipeline to start." >&2
          exit 1
